[gnb]
min_version = "0.1.0"

[vcpkg]
ref = "2025.12.12"
binary_cache = ".vcpkg_bincache"
root = ".vcpkg"

[external.streamline]
when = "windows"
url = "https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.10.0/streamline-sdk-v2.10.0.zip"

[external.tsc]
version = "v2025.5.23"
windows = "https://github.com/rxliuli/tsgo-npm-release/releases/download/v2025.5.23/tsgo-windows-amd64.exe"
linux = "https://github.com/rxliuli/tsgo-npm-release/releases/download/v2025.5.23/tsgo-linux-amd64"
macos_amd64 = "https://github.com/rxliuli/tsgo-npm-release/releases/download/v2025.5.23/tsgo-darwin-amd64"
macos_arm64 = "https://github.com/rxliuli/tsgo-npm-release/releases/download/v2025.5.23/tsgo-darwin-arm64"

[external.moltenvk]
when = "ios"
url = "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.0/MoltenVK-ios.tar"

[external.slang]
linux = "https://github.com/shader-slang/slang/releases/download/v2025.6.1/slang-2025.6.1-linux-x86_64.zip"
macos_amd64 = "https://github.com/shader-slang/slang/releases/download/v2025.6.1/slang-2025.6.1-macos-x86_64.zip"
macos_arm64 = "https://github.com/shader-slang/slang/releases/download/v2025.6.1/slang-2025.6.1-macos-aarch64.zip"

[external.vulkansdk]
version = "1.4.341.1"
root = "external/VulkanSDK"

[external.llm]
# 当前默认使用的模型 id，必须匹配下面 [[external.llm.models]] 中的某一个 id
active = "gemma-4-E4B-it-Q4_K_M"

[external.llm.llama]
# llama.cpp 预编译 release（来自 ggml-org/llama.cpp）
# Gemma 3n/4 需要 >= b5165；这里选用稳定的 b6000
version = "b6000"
windows_vulkan = "https://github.com/ggml-org/llama.cpp/releases/download/b6000/llama-b6000-bin-win-vulkan-x64.zip"
windows_cpu    = "https://github.com/ggml-org/llama.cpp/releases/download/b6000/llama-b6000-bin-win-cpu-x64.zip"
linux_vulkan   = "https://github.com/ggml-org/llama.cpp/releases/download/b6000/llama-b6000-bin-ubuntu-vulkan-x64.zip"
linux_cpu      = "https://github.com/ggml-org/llama.cpp/releases/download/b6000/llama-b6000-bin-ubuntu-x64.zip"
macos_arm64    = "https://github.com/ggml-org/llama.cpp/releases/download/b6000/llama-b6000-bin-macos-arm64.zip"

[[external.llm.models]]
id      = "gemma-4-E4B-it-Q4_K_M"
file    = "gemma-4-E4B-it-Q4_K_M.gguf"
url     = "https://huggingface.co/unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_K_M.gguf"
context = 8192

[[external.llm.models]]
id      = "gemma-3n-E4B-it-Q4_K_M"
file    = "gemma-3n-E4B-it-Q4_K_M.gguf"
url     = "https://huggingface.co/unsloth/gemma-3n-E4B-it-GGUF/resolve/main/gemma-3n-E4B-it-Q4_K_M.gguf"
context = 8192

[external.llm.server]
host         = "127.0.0.1"
port         = 8765
gpu_layers   = 99
idle_seconds = 600

[paks]
repo = "gameknife/gkNextEngine"
release_tag = "paks-latest"

[[paks.assets]]
id = "ldraw"
name = "ldraw.pak"
dest = "assets/paks/ldraw.pak"

[[paks.assets]]
id = "optional"
name = "optional.pak"
dest = "assets/paks/optional.pak"

[[paks.assets]]
id = "brotato3d"
name = "brotato3d.pak"
dest = "assets/paks/brotato3d.pak"

[[paks.assets]]
id = "sfx"
name = "bgm.mp3"
dest = "assets/sfx/bgm.mp3"

[[paks.assets]]
id = "sfx"
name = "bgm2.mp3"
dest = "assets/sfx/bgm2.mp3"

[[paks.assets]]
id = "sfx"
name = "put.mp3"
dest = "assets/sfx/put.mp3"

[[paks.assets]]
id = "sfx"
name = "put1.wav"
dest = "assets/sfx/put1.wav"

[[paks.assets]]
id = "sfx"
name = "put2.wav"
dest = "assets/sfx/put2.wav"

[[paks.assets]]
id = "sfx"
name = "put3.wav"
dest = "assets/sfx/put3.wav"

[[paks.assets]]
id = "ffmpeg"
name = "ffmpeg.exe"
dest = "src/ThirdParty/ffmpeg/bin/ffmpeg.exe"

[targets]
default = "gkNextRenderer"
all = [
  "gkNextRenderer",
  "gkNextEditor",
  "gkNextStillBenchmark",
  "gkNextMotionBenchmark",
  "gkNextVisualTest",
  "MagicaLego",
  "KongLie3D",
  "Brotato3D",
  "FlappyCpp",
  "FlappyJs",
  "BrickPlayer",
  "CharacterDemo",
  "Packager",
  "gkNextUnitTests"
]
