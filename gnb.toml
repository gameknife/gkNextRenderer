[gnb]
min_version = "0.1.0"

[ai]
default_profile = "general"

[ai.providers.localllm]
kind = "llama-cpp"
display_name = "Local Llama"
runtime = "external.llm"

[ai.profiles.general]
provider = "localllm"
temperature = 0.7
max_output_tokens = 2048

[ai.profiles.scad-scene]
provider = "localllm"
temperature = 0.4
max_output_tokens = 4096

[ai.profiles.scad-studio]
provider = "localllm"
temperature = 0.4
max_output_tokens = 4096

[ai.profiles.scad-authoring]
provider = "localllm"
temperature = 0.4
max_output_tokens = 4096

[ai.profiles.magicalego-script]
provider = "localllm"
temperature = 0.4
max_output_tokens = 4096

[ai.profiles.simulation]
provider = "localllm"
temperature = 0.4
max_output_tokens = 1024
max_concurrency = 1

[vcpkg]
ref = "2026.04.27"
binary_cache = ".vcpkg_bincache"
root = ".vcpkg"

[external.streamline]
when = "windows"
url = "https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.10.0/streamline-sdk-v2.10.0.zip"

[external.fidelityfx]
when = "windows"
version = "1.1.4"
url = "https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/archive/refs/tags/v1.1.4.zip"

[external.tsc]
version = "v2025.5.23"
windows = "https://github.com/rxliuli/tsgo-npm-release/releases/download/v2025.5.23/tsgo-windows-amd64.exe"
linux = "https://github.com/rxliuli/tsgo-npm-release/releases/download/v2025.5.23/tsgo-linux-amd64"
macos_amd64 = "https://github.com/rxliuli/tsgo-npm-release/releases/download/v2025.5.23/tsgo-darwin-amd64"
macos_arm64 = "https://github.com/rxliuli/tsgo-npm-release/releases/download/v2025.5.23/tsgo-darwin-arm64"

[external.moltenvk]
when = "ios"
url = "https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.0/MoltenVK-ios.tar"

[external.vulkansdk]
version = "1.4.341.1"
root = "external/VulkanSDK"

[external.llm]
# 当前默认使用的模型 id，必须匹配下面 [[external.llm.models]] 中的某一个 id
active = "gemma-4-E4B-it-Q4_K_M"

[external.llm.llama]
# llama.cpp 预编译 release（来自 ggml-org/llama.cpp）
# Gemma 4 需要新版 llama.cpp。
version = "b9296"
windows_vulkan = "https://github.com/ggml-org/llama.cpp/releases/download/b9296/llama-b9296-bin-win-vulkan-x64.zip"
windows_cpu    = "https://github.com/ggml-org/llama.cpp/releases/download/b9296/llama-b9296-bin-win-cpu-x64.zip"
linux_vulkan   = "https://github.com/ggml-org/llama.cpp/releases/download/b9296/llama-b9296-bin-ubuntu-vulkan-x64.tar.gz"
linux_cpu      = "https://github.com/ggml-org/llama.cpp/releases/download/b9296/llama-b9296-bin-ubuntu-x64.tar.gz"
macos_arm64    = "https://github.com/ggml-org/llama.cpp/releases/download/b9296/llama-b9296-bin-macos-arm64.tar.gz"

[[external.llm.models]]
id      = "gemma-4-E4B-it-Q4_K_M"
file    = "gemma-4-E4B-it-Q4_K_M.gguf"
url     = "https://huggingface.co/unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_K_M.gguf"
context = 131072

[[external.llm.models]]
id      = "gemma-4-E2B-it-Q4_K_M"
file    = "gemma-4-E2B-it-Q4_K_M.gguf"
url     = "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf"
context = 131072

[[external.llm.models]]
id      = "gemma-4-12B-it-qat-UD-Q4_K_XL"
file    = "gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
url     = "https://huggingface.co/unsloth/gemma-4-12B-it-qat-GGUF/resolve/main/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf"
context = 131072

[[external.llm.models]]
id      = "gemma-4-12B-it-Q4_K_M"
file    = "gemma-4-12B-it-Q4_K_M.gguf"
url     = "https://huggingface.co/unsloth/gemma-4-12b-it-GGUF/resolve/main/gemma-4-12b-it-Q4_K_M.gguf"
context = 131072


[external.llm.server]
host         = "127.0.0.1"
port         = 8765
gpu_layers   = 99
idle_seconds = 600

[paks]
repo = "gameknife/gkNextEngine"
release_tag = "paks-latest"

[[paks.assets]]
id = "ldraw"
name = "ldraw.pak"
dest = "assets/paks/ldraw.pak"

[[paks.assets]]
id = "optional"
name = "optional.pak"
dest = "assets/paks/optional.pak"

[[paks.assets]]
id = "brotato3d"
name = "brotato3d.pak"
dest = "assets/paks/brotato3d.pak"

[[paks.assets]]
id = "magicalego"
name = "magicalego.pak"
dest = "assets/paks/magicalego.pak"

[[paks.assets]]
id = "ffmpeg"
name = "ffmpeg.exe"
dest = "src/ThirdParty/ffmpeg/bin/ffmpeg.exe"

[targets]
default = "gkNextRenderer"
all = [
  "gkNextRenderer",
  "gkNextMinimalRenderer",
  "gkNextEditor",
  "gkNextStillBenchmark",
  "gkNextMotionBenchmark",
  "gkNextVisualTest",
  "RmlUiDemo",
  "ScadStudio",
  "ScadLibrary",
  "MagicaLego",
  "KongLie3D",
  "Brotato3D",
  "NextRA",
  "FlappyCpp",
  "FlappyJs",
  "BrickPlayer",
  "CharacterDemo",
  "TruckerDemo",
  "StudioSim",
  "AirportSim",
  "CitySolSim",
  "Voyage3D",
  "Packager",
  "ScadCatalog",
  "gkNextUnitTests"
]
