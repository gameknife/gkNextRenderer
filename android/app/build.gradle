plugins {
    id 'com.android.application'
}

// Pull the SDL3 Android archive straight from libsdl-org's official release
// (SDL3-devel-<ver>-android.zip contains SDL3-<ver>.aar). The archive is no longer
// committed to the repo; this task hydrates app/libs/ before the build runs.
ext.sdlVersion = '3.2.22'
def sdlAarFile = file("libs/SDL3-${sdlVersion}.aar")
def sdlAndroidZipUrl = "https://github.com/libsdl-org/SDL/releases/download/release-${sdlVersion}/SDL3-devel-${sdlVersion}-android.zip"

task downloadSdlAar {
    description "Fetch SDL3-${sdlVersion}.aar from libsdl-org's official Android dev archive."
    group 'sdl'
    onlyIf { !sdlAarFile.exists() }
    doLast {
        sdlAarFile.parentFile.mkdirs()
        def tmpZip = new File(sdlAarFile.parentFile, "SDL3-devel-${sdlVersion}-android.zip")
        println "[sdl] Downloading ${sdlAndroidZipUrl}"
        new URL(sdlAndroidZipUrl).withInputStream { input ->
            tmpZip.withOutputStream { it << input }
        }
        copy {
            from(zipTree(tmpZip)) { include "SDL3-${sdlVersion}.aar" }
            into sdlAarFile.parentFile
        }
        tmpZip.delete()
        if (!sdlAarFile.exists()) {
            throw new GradleException("downloadSdlAar: SDL3-${sdlVersion}.aar missing after extraction")
        }
        println "[sdl] Wrote ${sdlAarFile}"
    }
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn downloadSdlAar }
}

android {
    def repoRoot = rootProject.rootDir.absoluteFile.parentFile
    def ndkPath = System.getenv("ANDROID_NDK_HOME")

    signingConfigs {
        debug {
            storeFile file('../keystore/public.jks')
            storePassword 'public'
            keyAlias 'public'
            keyPassword 'public'
        }
        release {
            storeFile file('../keystore/public.jks')
            storePassword 'public'
            keyAlias 'public'
            keyPassword 'public'
        }
    }
    namespace "org.libsdl.helloworld"
    compileSdk 35

    defaultConfig {
        applicationId 'com.gknext.renderer'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                        //'-DCMAKE_BUILD_TYPE=Release',
                        '-DANDROID_PLATFORM=33',
                        '-DVCPKG_CMAKE_SYSTEM_VERSION=33',
                        '-DVCPKG_TARGET_TRIPLET=arm64-android',
                        "-DCMAKE_TOOLCHAIN_FILE=${repoRoot}/.vcpkg/scripts/buildsystems/vcpkg.cmake",
                        "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${ndkPath}/build/cmake/android.toolchain.cmake"
                        //abiFilters 'arm64-v8a', 'x86_64'
                        abiFilters 'arm64-v8a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version "3.31.6"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "DEBUG", "false"
        }
        debug {
            buildConfigField "boolean", "DEBUG", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
        android.buildFeatures.buildConfig true
    }
}

dependencies {
    implementation files("libs/SDL3-${sdlVersion}.aar")
}

task installAndLaunch(type: Exec) {
    doFirst {
        println "Installing app and launching..."
    }

    commandLine 'adb', 'install', "$buildDir/outputs/apk/debug/app-debug.apk"
    
    doLast {
        exec {
            commandLine 'adb', 'shell', 'am', 'start', '-n', 'com.gknext.renderer/org.libsdl.helloworld.HelloWorldActivity'
        }
        println "App launched, starting logcat..."
        exec {
            commandLine 'adb', 'logcat', '-s', 'gknext'
        }
    }
}
