name: No-Unity Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  windows-no-unity:
    name: Windows No-Unity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Cache key
        id: gnb
        shell: pwsh
        run: |
          "key=$(.\gnb.bat info --bincache-key)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v6
        id: cache-vcpkg-restore
        with:
          path: |
            .vcpkg
            .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
      - name: Setup dependencies
        run: .\gnb.bat setup
      - name: Configure without Unity Build
        run: cmake --preset windows-no-unity
      - name: Build all targets without Unity Build
        run: cmake --build --preset windows-no-unity --parallel
      - uses: actions/cache/save@v6
        if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
        with:
          path: |
            .vcpkg
            .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
