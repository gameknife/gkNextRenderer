name: Linux CI

on: 
  pull_request:
    branches:
      - main
      - dev
      - 'releases/**'
  push:
    branches:
      - main
      - 'releases/**'
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'assets/shaders/**'
      - '*.sh'
      - '*.bat'
      - '**/CMakeLists.txt'
jobs:
  build:
    runs-on: ubuntu-22.04
    env: 
      SDK_VERSION: 1.4.313
    steps:
    - uses: actions/checkout@v4
    - name: Install Ubuntu dependencies
      run: |
        sudo apt-get update
        sudo apt-get install curl unzip tar libxi-dev libxinerama-dev libxcursor-dev xorg-dev ninja-build
    - name: Install Vulkan SDK
      run: |
        wget -qO - http://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-${SDK_VERSION}-jammy.list http://packages.lunarg.com/vulkan/${SDK_VERSION}/lunarg-vulkan-${SDK_VERSION}-jammy.list
        sudo apt-get update
        sudo apt-get install vulkan-sdk

    - name: Compile vcpkg dependencies
      run: ./vcpkg.sh

    - name: Restore cached vcpkg
      id: cache-vcpkg-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          .vcpkg
          .vcpkg_bincache
        key: ${{ runner.os }}-desktop-bincache

    - name: Compile gkNextRenderer
      run: ./build.sh --preset linux-release

    - name: Save vcpkg to cache
      if: github.event_name != 'pull_request'
      id: cache-vcpkg-save
      uses: actions/cache/save@v4
      with:
        path: |
          .vcpkg
          .vcpkg_bincache
        key: ${{ steps.cache-vcpkg-restore.outputs.cache-primary-key }}


