name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Cache key
        id: gnb
        run: echo "key=$(.\gnb.bat info --bincache-key)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/restore@v4
        id: cache-vcpkg-restore
        with:
          path: |
            .vcpkg
            .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
      - uses: microsoft/setup-msbuild@v2
      - name: Setup dependencies
        run: .\gnb.bat setup
        shell: cmd
      - name: Build
        run: .\gnb.bat build
        shell: cmd
      - uses: actions/cache/save@v4
        if: steps.cache-vcpkg-restore.outputs.cache-hit != 'true'
        with:
          path: |
            .vcpkg
            .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
