name: MacOS CI

on:
  pull_request:
    branches: [main, dev, 'releases/**']
  push:
    branches: [main, 'releases/**']
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'assets/shaders/**'
      - 'tools/gnb/**'
      - 'gnb.*'
      - '**/CMakeLists.txt'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Vulkan dependencies
        run: |
          brew install molten-vk
          brew install glslang
      - name: Cache key
        id: gnb
        run: echo "key=$(./gnb.sh info --bincache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache-vcpkg-restore
        with:
          path: |
            .vcpkg
            .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
      - run: ./gnb.sh setup
      - run: ./gnb.sh build
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            .vcpkg
            .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}
