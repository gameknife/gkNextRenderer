name: Release NextRenderer

on:
  push:
    tags:
      - 'v*'

jobs:
  make-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  android-build:
    needs: make-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Build Android
        run: |
          echo "BUILDVER(${{ github.ref_name }})" > src/build.version
          ./gnb.sh setup --skip-paks
          ./gnb.sh android release
          zip -r gknextrenderer_android_${{ github.ref_name }}.zip ./android/app/build/outputs/apk/release/app-release.apk ./deploy_android.bat
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./gknextrenderer_android_${{ github.ref_name }}.zip

  linux-build:
    needs: make-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install curl unzip tar ninja-build libxi-dev libxinerama-dev libxcursor-dev libxrandr-dev wayland-protocols libxkbcommon-dev libx11-dev libxft-dev libxext-dev
      - name: Build and package
        run: |
          echo "BUILDVER(${{ github.ref_name }})" > src/build.version
          ./gnb.sh setup
          ./gnb.sh build
          ./gnb.sh package linux --version ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./gknextrenderer_linux64_${{ github.ref_name }}.zip

  windows-build:
    needs: make-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - uses: microsoft/setup-msbuild@v3
      - name: Build and package
        run: |
          echo BUILDVER(${{ github.ref_name }}) > src/build.version
          .\gnb.bat setup
          .\gnb.bat build
          .\gnb.bat package windows --version ${{ github.ref_name }}
        shell: cmd
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./gkNextRenderer-windows.zip
