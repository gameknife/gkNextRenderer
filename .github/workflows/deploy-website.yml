name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  # 论坛主题是构建期从 Discussions 抓的快照，所以定时重建一次，
  # 新发的主题不用等下一次 push 才上线。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # 抓 Announcements 分类的讨论列表要读 Discussions。
  discussions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package.json

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Install dependencies
        run: cd website && npm install

      - name: Build with VitePress
        env:
          GITHUB_PAGES: 'true'
          # npm run build 会先跑 scripts/fetch-discussions.mjs；没 token 时它会
          # 沿用仓库里已提交的快照，不会让构建失败。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
        run: cd website && npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
