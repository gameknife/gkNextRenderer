name: Android CI

on:
  pull_request:
    branches: [main, dev, 'releases/**']
  push:
    branches: [main, 'releases/**']
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'assets/shaders/**'
      - 'tools/gnb/**'
      - 'gnb.*'
      - '**/CMakeLists.txt'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      SDK_VERSION: 1.4.313
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Vulkan SDK
        run: |
          wget -qO - http://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-${SDK_VERSION}-jammy.list http://packages.lunarg.com/vulkan/${SDK_VERSION}/lunarg-vulkan-${SDK_VERSION}-jammy.list
          sudo apt-get update
          sudo apt-get install vulkan-sdk
      - name: Cache key
        id: gnb
        run: echo "key=$(./gnb.sh info --bincache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache-vcpkg-restore
        with:
          path: |
            .vcpkg
            .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}-android
      - run: ./gnb.sh setup --vcpkg-only
      - run: ./gnb.sh android release
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            .vcpkg
            .vcpkg_bincache
          key: ${{ steps.gnb.outputs.key }}-android
